<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>经历工作台</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2356ba9f'/%3E%3Cstop offset='1' stop-color='%231d3b31'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M10 16.5l4 4 8-9' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="app" id="app">
  <aside class="rail">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">
        <b>经历工作台</b>
      </span>
    </div>

    <nav class="rail-nav" id="nav" aria-label="主导航"></nav>

    <div class="rail-foot">
      <button class="rail-user" id="railUser" data-go="profile" title="基本信息（姓名 / 专业 / 联系方式）" aria-label="基本信息">
        <span class="avatar" id="railAvatar">我</span>
        <span class="who">
          <b id="railName">未设置姓名</b>
          <span id="railSub">点这里补全信息</span>
        </span>
        <span class="ic ic-cog" aria-hidden="true"></span>
      </button>
      <div class="rail-meta" id="railMeta"></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h1 id="viewTitle">概览</h1>
        <p id="viewSub" class="page-sub"></p>
      </div>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>

    <section class="view" id="view" tabindex="-1"></section>
  </main>
</div>

<div class="drawer-scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="经历详情"></aside>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<dialog class="modal" id="modal"></dialog>

<noscript>
  <div style="padding:40px;text-align:center;font-size:14px">
    这个界面需要 JavaScript 才能运行。请用现代浏览器打开。
  </div>
</noscript>

<!-- 经历类型的图标精灵。只有「类型」这一组用 SVG——形状比 CSS 拼的更好认，
     其余界面图标仍是 styles.css 里手写的那批，不必为一致性把两边都改掉。 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="ic-trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 4h12v5a6 6 0 0 1-12 0V4z"/><path d="M6 6H4.4a2 2 0 0 0 0 4H6"/><path d="M18 6h1.6a2 2 0 0 1 0 4H18"/>
    <path d="M12 15v4"/><path d="M8.5 21h7"/>
  </symbol>
  <symbol id="ic-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z"/><path d="M14 3v5h5"/>
    <path d="M9 13h6"/><path d="M9 17h6"/>
  </symbol>
  <symbol id="ic-bulb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3a6 6 0 0 0-3.5 10.9c.5.4.8 1 .8 1.6V17h5.4v-1.5c0-.6.3-1.2.8-1.6A6 6 0 0 0 12 3z"/>
    <path d="M9.5 20h5"/><path d="M10.5 22.5h3"/>
  </symbol>
  <symbol id="ic-medal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 2.5h8L14 9h-4L8 2.5z"/><circle cx="12" cy="15" r="5.2"/>
    <path d="M12 12.4l.85 1.7 1.9.28-1.37 1.34.32 1.88L12 16.7l-1.7.9.32-1.88L9.25 14.4l1.9-.28.85-1.72z"/>
  </symbol>
  <symbol id="ic-people" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="7.5" r="3.5"/><path d="M2.5 20.5v-1.2a4.5 4.5 0 0 1 4.5-4.5h4a4.5 4.5 0 0 1 4.5 4.5v1.2"/>
    <path d="M16.5 4.4a3.5 3.5 0 0 1 0 6.6"/><path d="M18.5 20.5v-1.2a4.5 4.5 0 0 0-2.2-3.87"/>
  </symbol>
  <symbol id="ic-briefcase" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="7" width="18" height="13" rx="1.6"/>
    <path d="M9 7V4.8A1.3 1.3 0 0 1 10.3 3.5h3.4A1.3 1.3 0 0 1 15 4.8V7"/>
    <path d="M3 12.5h18"/>
  </symbol>
  <symbol id="ic-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20.4S4.6 15.9 4.6 10.6A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 7.4 3c0 5.3-7.4 9.8-7.4 9.8z"/>
  </symbol>
  <symbol id="ic-badge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3l7 3v6c0 4.4-3 8.3-7 9.3C8 20.3 5 16.4 5 12V6l7-3z"/><path d="M9 12l2.2 2.2L15.5 10"/>
  </symbol>
  <symbol id="ic-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 11.6V5.2A1.7 1.7 0 0 1 5.2 3.5h6.4L21 12.9 12.9 21 3.5 11.6z"/>
    <circle cx="8.3" cy="8.3" r="1.4"/>
  </symbol>
  <symbol id="ic-tpl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M3.5 9h17"/><path d="M9 9v11.5"/>
  </symbol>
  <symbol id="ic-print" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 9V3.5h10V9"/><rect x="3.5" y="9" width="17" height="7.5" rx="1.6"/>
    <path d="M7 14h10v6.5H7z"/>
  </symbol>
</svg>

<script src="/app.js" defer></script>
</body>
</html>
